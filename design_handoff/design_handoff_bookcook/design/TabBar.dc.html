<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<nav aria-label="Main" style="display:grid;grid-template-columns:repeat(5,minmax(0,1fr));align-items:end;padding:8px 4px 14px;box-sizing:border-box;border-top:1px solid var(--line);background-color:var(--paper);background-image:var(--grain)">
<sc-for list="{{ items }}" as="it" hint-placeholder-count="5">
<sc-if value="{{ it.on }}" hint-placeholder-val="{{ false }}"><a href="#" aria-current="page" style="min-height:3.5556rem;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--ink);font-weight:700;font-size:min(var(--text-sm),15px);line-height:1.1;text-decoration:none"><span class="material-symbols-rounded" aria-hidden="true" style="font-variation-settings:'FILL' 1">{{ it.icon }}</span>{{ it.label }}</a></sc-if>
<sc-if value="{{ it.off }}" hint-placeholder-val="{{ true }}"><a href="#" style="min-height:3.5556rem;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--ink-muted);font-size:min(var(--text-sm),15px);line-height:1.1;text-decoration:none"><span class="material-symbols-rounded" aria-hidden="true">{{ it.icon }}</span>{{ it.label }}</a></sc-if>
<sc-if value="{{ it.isNew }}" hint-placeholder-val="{{ false }}"><a href="#" style="min-height:3.5556rem;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:3px;color:var(--ink);font-weight:700;font-size:min(var(--text-sm),15px);line-height:1.1;text-decoration:none"><span style="width:2.9rem;height:2.9rem;border-radius:999px;background:var(--tab-new-bg);color:var(--tab-new-fg);display:grid;place-items:center;box-shadow:var(--shadow-paper)"><span class="material-symbols-rounded" aria-hidden="true" style="font-size:1.8rem">add</span></span>New</a></sc-if>
</sc-for>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:90},&quot;current&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;cookbook&quot;,&quot;grocery&quot;,&quot;requests&quot;,&quot;settings&quot;,&quot;none&quot;],&quot;default&quot;:&quot;cookbook&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const cur = this.props.current ?? 'cookbook';
    const items = [['cookbook', 'Cookbook', 'menu_book'], ['grocery', 'Grocery', 'shopping_basket'], ['new', 'New', 'add'], ['requests', 'Requests', 'volunteer_activism'], ['settings', 'Settings', 'settings']]
      .map(([id, label, icon]) => ({ label, icon, isNew: id === 'new', on: id !== 'new' && id === cur, off: id !== 'new' && id !== cur }));
    return { items };
  }
}
</script>
</body>
</html>

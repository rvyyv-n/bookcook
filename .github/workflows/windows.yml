# Builds the Windows installer (Tauri, unsigned) and attaches it to the GitHub release, where the Windows
# app's update check finds it. It runs when a version tag is pushed, beside release.yml, which creates the
# release. To add an installer to a release that already exists, run it by hand from main with that tag.
# Pushes to a wip/ branch that touch src-tauri/ build the installer as a downloadable artifact only.
name: Windows installer

on:
  push:
    tags: ['v*']
    branches: ['wip/**']
    paths: ['src-tauri/**', '.github/workflows/windows.yml']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release to attach the installer to (for example v1.1.0)'
        required: true

permissions:
  contents: write

jobs:
  installer:
    runs-on: windows-latest
    env:
      TAG: ${{ inputs.tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: Check the tag matches package.json
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ -n "$TAG" ] && [ "$TAG" != "v$VERSION" ]; then echo "Tag $TAG doesn't match package.json version $VERSION"; exit 1; fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
      # The app icons are drawn from the same logo as the web app's.
      - run: npx tauri icon public/icons/icon-512.png
      - run: npx tauri build
      - name: Name the installer
        shell: bash
        run: cp src-tauri/target/release/bundle/nsis/*-setup.exe "bookcook-$VERSION-setup.exe"
      - uses: actions/upload-artifact@v5
        with:
          name: bookcook-windows-installer
          path: bookcook-*-setup.exe
      - name: Attach it to the release
        if: env.TAG != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # release.yml creates the release when the tag is pushed; wait for it.
          for i in $(seq 1 40); do
            gh release view "$TAG" >/dev/null 2>&1 && break
            sleep 15
          done
          gh release upload "$TAG" "bookcook-$VERSION-setup.exe" --clobber

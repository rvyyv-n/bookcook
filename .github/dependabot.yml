# Monthly update pull requests, one per ecosystem, checked by the deploy workflow before merging.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      dependencies:
        patterns: ['*']
    # typescript-eslint doesn't support TypeScript 7 yet, so `npm ci` can't resolve it. Lift once it does.
    ignore:
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']

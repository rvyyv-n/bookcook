<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Recipes in their own words. Say or type a recipe, then cook it hands-free." />
    <!-- What a message app shows for a link to Bookcook. A shared recipe rides in the link's #fragment, which never reaches a server. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Bookcook" />
    <meta property="og:title" content="Bookcook" />
    <meta property="og:description" content="A cookbook you can talk to. Recipes in their own words." />
    <meta name="theme-color" content="#FBF7F0" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#171411" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <title>Bookcook</title>
    <style>
      /* Shown until the app's script has loaded: the paper colour and the app icon, so a slow phone never shows a blank page. */
      html {
        background: #fbf7f0;
      }
      @media (prefers-color-scheme: dark) {
        html {
          background: #171411;
        }
      }
      .boot {
        min-height: 100vh;
        min-height: 100dvh;
        display: grid;
        place-items: center;
      }
      .boot img {
        width: 96px;
        height: 96px;
        border-radius: 22px;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot" aria-hidden="true"><img src="/icons/icon-192.png" alt="" /></div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
